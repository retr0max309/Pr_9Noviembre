name: CI pruebas automatizadas en dev
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
jobs:
  test_app:
    name: ejecutar pruebas python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "Empezando con pruebas de python"
          python -m pytest --rootdir . -s
      - name : Reporte final
        run: |
          echo "Pruebas finalizadas"